.kicker{font-family:var(--sans);font-size:11.5px;letter-spacing:.22em;color:var(--jade);text-transform:uppercase}

.ornament .ln.r{transform:scaleX(-1)}

.pulses{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:min(430px,100%);margin:clamp(14px,2.4vh,22px) auto}
.pulses span{font-family:var(--sans);font-size:12px;color:var(--rice-dim);border:1px solid var(--line);border-radius:14px;padding:5px 12px}

.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px var(--jade)}
.btn.ghost{background:none;color:var(--rice-dim);border:1px solid var(--line);box-shadow:none;font-size:13px;padding:10px 24px;margin-top:12px}
.btn.ghost:hover{color:var(--rice);transform:none;border-color:var(--rice-dim)}
.foot-note{font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:14px;letter-spacing:.03em}

/* ===== quiz ===== */
.prog{width:100%;max-width:480px;display:flex;align-items:center;gap:12px;margin-bottom:clamp(14px,3vh,26px)}
.prog-txt{font-family:var(--sans);font-size:12px;color:var(--muted);flex:0 0 auto;letter-spacing:.08em}
.prog-bar{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--jade),var(--gold));border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.q-axis{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--jade);border:1px solid rgba(91,178,149,.4);border-radius:18px;padding:3px 14px}
.q-axis.ev{color:var(--gold-l);border-color:rgba(201,164,92,.45)}
.q-text{font-size:clamp(18px,3vh,23px);font-weight:600;color:var(--rice);line-height:1.45;margin:14px 0 6px}
.q-hint{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:clamp(14px,2.6vh,22px)}
.opts{display:flex;flex-direction:column;gap:9px;width:100%;max-width:480px}
.opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-family:var(--serif);font-size:clamp(13.5px,1.95vh,15px);color:var(--rice);background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:11px;padding:11px 16px;cursor:pointer;transition:.2s;line-height:1.4;-webkit-tap-highlight-color:transparent}
/* hover 效果只在真有指针悬停的设备生效，避免触屏点击后样式“粘”到下一题同位置的选项 */
@media(hover:hover){.opt:hover{border-color:var(--jade);transform:translateX(4px);box-shadow:-5px 0 16px -10px var(--jade)}}
.opt .tag{flex:0 0 auto;font-family:var(--sans);font-size:9.5px;color:var(--muted);letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.back{font-family:var(--sans);font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;margin-top:16px}
.back:hover{color:var(--rice)}

/* ===== result ===== */
.res-card{width:100%;max-width:490px;background:linear-gradient(180deg,var(--panel),#12171c);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,2.6vh,26px) clamp(18px,4vw,28px);text-align:left}
.res-block{text-align:left;margin-top:clamp(12px,2vh,16px);border-top:1px dashed var(--line);padding-top:clamp(10px,1.6vh,13px)}
.res-block:first-child{border-top:none;padding-top:0}
.res-block .lab{font-family:var(--sans);font-size:11px;letter-spacing:.12em;color:var(--jade);margin-bottom:6px}
.res-block .lab.cb{color:var(--cinnabar)}
.res-block p{font-size:13.5px;color:var(--rice-dim);line-height:1.62}

.res-block .fix{margin-top:8px;color:#9fe0cc}
.m-link{display:inline-block;margin-top:12px;font-family:var(--sans);font-size:13px;color:var(--jade);text-decoration:none;border:1px solid rgba(91,178,149,.4);border-radius:8px;padding:8px 17px}
.m-link:hover{background:rgba(91,178,149,.12)}

.reveal{text-align:center}
.rv-line{font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.1em}
.rv-realm{font-family:var(--brush);font-size:clamp(42px,7.4vh,62px);line-height:1.12}
.rv-realm.dim{color:var(--rice-dim);opacity:.62;font-size:clamp(30px,5vh,44px)}
.rv-depth{font-family:var(--sans);font-size:15px;color:var(--rice-dim);margin-left:6px}
.rv-arrow{font-family:var(--sans);font-size:12px;color:var(--gold-l);margin:5px 0;letter-spacing:.08em}
.rv-risk{display:inline-block;margin-top:9px;font-family:var(--sans);font-size:12px;color:#f0c4bb;border:1px solid rgba(208,95,76,.5);border-radius:14px;padding:3px 13px;background:rgba(208,95,76,.08)}
.rv-note{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5}

.radar{display:flex;justify-content:center;margin-top:4px}
.radar svg{width:min(300px,84vw);height:auto}
.radar text{font-family:var(--sans)}

.demon-row{display:flex;gap:11px;align-items:baseline;border-top:1px dashed var(--line);padding:9px 0}
.demon-row:first-of-type{border-top:none;padding-top:2px}
.demon-row .dn{flex:0 0 auto;font-family:var(--brush);font-size:17px;color:#f0c4bb;white-space:nowrap}
.demon-row .dt{font-family:var(--sans);font-size:12.5px;color:var(--rice-dim);line-height:1.5}

.share-tip{font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:14px;text-align:center}
/* 移动端法印卡预览浮层 */
.seal-modal{position:fixed;inset:0;z-index:99;background:rgba(8,11,14,.94);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}

.seal-modal img{width:100%;max-width:min(82vw,420px);height:auto;border-radius:12px;box-shadow:0 14px 44px -12px #000;border:1px solid var(--line)}

.seal-modal .seal-close{margin-top:12px;font-family:var(--sans);font-size:13px;color:var(--rice-dim);background:none;border:1px solid var(--line);border-radius:20px;padding:8px 26px;cursor:pointer}

// 选项随机排序：分值绑定在选项本身（原始下标 == 分值），打乱的只是显示位置；
// 渲染按 ORDER 给出的显示顺序，但 onclick 始终回传「原始下标」，故计分不受位置影响。
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildOrder(){ORDER=ITEMS.map(function(it){var base=it.opts.map(function(_,i){return i;});return it.kind==='evid'?base:shuffle(base);});} // 证据题不打乱
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});document.getElementById(id).classList.add('on');window.scrollTo({top:0,behavior:'smooth'});}

function render(){
  var it=ITEMS[idx];
  var ord=ORDER[idx]||it.opts.map(function(_,i){return i;});

  document.getElementById('pnum').textContent=isEv?'定位':(idx+' / 24');   // 证据题为开场定位，不计入题号；能力题 1/24…24/24

  }

}

/* ===================== 判定引擎（严格按规格） ===================== */
function demons(a){
  var list=[];
  if(a[10]===0||a[11]===0||a[13]===0) list.push('drowsy');     // 沉睡的车手（降境）
  if(a[14]===0) list.push('autopilot');                        // 自动化成瘾（降境）
  if(a[13]<=1 && a[15]<=1) list.push('dust');                  // 道心蒙尘
  if(a[9]<=1 && a[7]>=2) list.push('feedback');                // 幻觉回灌
  if(a[7]===0) list.push('idol');                              // 模型拜物
  if(a[24]===0) list.push('framework');                        // 框架走火
  if(a[21]===0) list.push('demo');                             // Demo 飞升
  if((a[10]>=2||a[11]>=2) && a[15]<=1 && a[16]<=1) list.push('diligent'); // 事必躬亲
  if(a[6]===1) list.push('collect');                           // Prompt 收藏癖
  return list;
}
function compute(){
  var a=ans;
  // 八脉均分（顺序：委托吐纳蕴藏神识守心周天法门传灯）
  var P=[(a[1]+a[2]+a[3])/3,(a[4]+a[5]+a[6])/3,(a[7]+a[8]+a[9])/3,(a[10]+a[11]+a[12])/3,
         (a[13]+a[14]+a[15])/3,(a[16]+a[17]+a[18])/3,(a[19]+a[20]+a[21])/3,(a[22]+a[23]+a[24])/3];
  var 神识=P[3],守心=P[4],周天=P[5],法门=P[6],传灯=P[7];
  // 关键脉封顶（取最严）
  var abilityCap=5;
  if(神识<1.5) abilityCap=Math.min(abilityCap,3);
  if(守心<1.5) abilityCap=Math.min(abilityCap,2);
  if(周天<2.0) abilityCap=Math.min(abilityCap,2);
  if(法门<2.0) abilityCap=Math.min(abilityCap,3);
  if(传灯<2.0) abilityCap=Math.min(abilityCap,4);
  var abilityRealm=abilityCap;                 // 初判（仅能力，不受证据封顶）
  // 证据封顶
  var ev=EVID[a[0]];
  var evAward=Math.min(ev.cap,5);              // 内功不直接授予，封到化神(5)
  var finalRealm=Math.min(abilityRealm,evAward);
  // 降境心魔
  var highRisk=false;
  if(a[10]===0||a[11]===0||a[13]===0||a[14]===0){finalRealm=Math.max(0,finalRealm-1);highRisk=true;}
  // 内功候选注记
  var internalNote=(ev.cap>=6 && abilityRealm>=5 && !highRisk)?ev.internal:null;
  if(internalNote){finalRealm=5;}
  // 同境深浅（八脉均分均匀切三档）
  var sum=0;for(var i=1;i<=24;i++)sum+=a[i];var avgAll=sum/24;
  var depth=internalNote?"圆满":(avgAll<1?"早期":avgAll<2?"中期":"圆满");
  // 心魔
  var dl=demons(a);
  var showDemons=dl.slice(0,2).map(function(k){return DEMON[k];});
  var maxDemon=dl.length?DEMON[dl[0]]:null;
  // 最强三脉
  var order=P.map(function(v,i){return {i:i,v:v};}).sort(function(x,y){return y.v-x.v;});
  var top3=order.slice(0,3).map(function(o){return PNAME[o.i];});
  // 最短板脉
  var weak=0;for(var i=1;i<8;i++){if(P[i]<P[weak])weak=i;}
  var weakName=PNAME[weak];
  // 破境主线
  var kan;
  if(finalRealm<=0) kan="凡人 → 炼气：挑 5 件你常做的事，固定用 AI 来做，先让 AI 进入日常。";
  else if(finalRealm===1) kan="炼气 → 筑基：给 1 个任务定下固定的「输入 / 步骤 / 输出 / 检查」，把随手问变成工作法。";
  else if(finalRealm===2){
    kan="筑基 → 金丹：这道坎在「神识 + 周天」。"+ (P[3]<=P[5]
      ? "你神识更弱——给最常做的任务列出它最容易错的 5 个点，每次产出都过一遍。"
      : "你周天更弱——选一个真实任务拆成 3 阶段，连跑 3 次，记录失败与改进。");
  }
  else if(finalRealm===3) kan="金丹 → 元婴：把你最熟的那条流程写成文档 / SOP，找 1 个人照着跑通。";
  else if(finalRealm===4) kan="元婴 → 化神：把你的方法用到一个全新类型的任务上，验证它不只在原地有效。";
  else kan="化神 → 内功：再往上是返虚 / 合道 / 道祖，需要真实团队、同行、生态的外部证据，自测无法授予。";
  // 典籍
  var books=BOOK[weakName]||[];
  var bookRealm=Math.min(Math.max(finalRealm,1),6);
  return {P:P,abilityRealm:abilityRealm,finalRealm:finalRealm,depth:depth,highRisk:highRisk,
          internalNote:internalNote,showDemons:showDemons,maxDemon:maxDemon,top3:top3,
          weakName:weakName,fix:FIX[weakName],kan:kan,books:books,bookRealm:bookRealm};
}
function finish(){document.getElementById('pfill').style.width='100%';renderResult(compute());}

/* ===================== 八脉雷达（纯 SVG） ===================== */
function radar(P){
  var lab=PNAME,cx=150,cy=150,R=104;
  function xy(i,r){var ang=(-90+i*45)*Math.PI/180;return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)];}
  var rings='';
  for(var k=1;k<=3;k++){var rp=[];for(var i=0;i<8;i++){var p=xy(i,R*k/3);rp.push(p[0].toFixed(1)+','+p[1].toFixed(1));}rings+='<polygon points="'+rp.join(' ')+'" fill="none" stroke="rgba(201,164,92,'+(k===3?'.5':'.18')+')" stroke-width="1"/>';}
  var ax='',lb='';
  for(var i=0;i<8;i++){var p=xy(i,R);ax+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(201,164,92,.16)" stroke-width="1"/>';
    var lp=xy(i,R+19);var anc=Math.abs(lp[0]-cx)<8?'middle':(lp[0]>cx?'start':'end');
    lb+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+'" fill="#b8b3a4" font-size="12.5" text-anchor="'+anc+'">'+lab[i]+'</text>';}
  var dp=[],dots='';
  for(var i=0;i<8;i++){var rr=R*Math.max(0.05,P[i]/3);var p=xy(i,rr);dp.push(p[0].toFixed(1)+','+p[1].toFixed(1));dots+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#5bb295"/>';}
  return '<div class="radar"><svg viewBox="0 0 300 300" aria-label="八脉雷达">'+rings+ax+lb+'<polygon points="'+dp.join(' ')+'" fill="rgba(91,178,149,.22)" stroke="#5bb295" stroke-width="2"/>'+dots+'</svg></div>';
}

/* ===================== 修为法印 · 分享卡（与 quiz.html 同一套实现） ===================== */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function qrEncode(text){
  var N=25, DATA_CW=28, EC_CW=16;
  var EXP=new Array(512), LOG=new Array(256);
  (function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d;}for(var i=255;i<512;i++)EXP[i]=EXP[i-255];})();
  function gmul(a,b){return (a===0||b===0)?0:EXP[LOG[a]+LOG[b]];}
  var bytes=[];for(var i=0;i<text.length;i++)bytes.push(text.charCodeAt(i)&0xff);
  var bits=[];function pb(v,n){for(var b=n-1;b>=0;b--)bits.push((v>>b)&1);}
  pb(4,4);pb(bytes.length,8);for(var i=0;i<bytes.length;i++)pb(bytes[i],8);

// 是否移动端（手机 / 平板）——iOS Safari 不支持 a[download] 存 blob，改用预览长按保存
function isTouchSave(){
  try{var ua=navigator.userAgent||'';
    var iOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    return iOS||/Android/i.test(ua)||/Mobile|HarmonyOS|Silk/i.test(ua);
  }catch(e){return false;}
}
// 移动端：把卡片图放进浮层，提示长按保存到相册
function showSealPreview(dataURL){
  var old=document.getElementById('sealModal');if(old)old.remove();
  var d=document.createElement('div');d.id='sealModal';d.className='seal-modal';
  d.innerHTML='<div class="seal-box"><img alt="修为法印" src="'+dataURL+'"><p>长按图片 · 保存到相册</p><button type="button" class="seal-close">关闭</button></div>';
  d.addEventListener('click',function(){d.remove();});
  d.querySelector('.seal-box').addEventListener('click',function(e){e.stopPropagation();});
  d.querySelector('.seal-close').addEventListener('click',function(){d.remove();});

}
function makeSeal(btn){
  if(!CARD){return;}
  var old=btn?btn.textContent:'';
  function reset(){if(btn){btn.disabled=false;btn.textContent=old||'凝练修为法印 · 存图分享';}}
  if(btn){btn.disabled=true;btn.textContent='凝练中…';}
  var FILE='几境-正卷-修为法印.png';
  var ready;
  try{ready=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load("400 120px 'MaShanLocal'"),document.fonts.load("400 40px 'SerifLocal'"),document.fonts.load("300 30px 'SansLocal'")]).catch(function(){}):Promise.resolve();}
  catch(e){ready=Promise.resolve();}
  ready.then(function(){
    var cv=drawSeal(CARD);
    if(isTouchSave()){ showSealPreview(cv.toDataURL('image/png')); reset(); return; } // 移动端：预览 + 长按保存
    if(cv.toBlob){                                                                     // PC：下载 PNG
      cv.toBlob(function(b){
        try{
          if(!b){showSealPreview(cv.toDataURL('image/png'));reset();return;}
          var url=URL.createObjectURL(b);var a=document.createElement('a');a.href=url;a.download=FILE;document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(url);},4000);
        }catch(e){try{showSealPreview(cv.toDataURL('image/png'));}catch(e2){}}
        reset();
      },'image/png');
    }else{
      var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=FILE;document.body.appendChild(a);a.click();a.remove();reset();
    }
  }).catch(function(){
    try{var c=window.__sealCanvas;if(c){showSealPreview(c.toDataURL('image/png'));}else{alert('生成失败，可直接截图保存。');}}
    catch(e){alert('生成失败，可直接截图保存。');}
    reset();
  });
}
